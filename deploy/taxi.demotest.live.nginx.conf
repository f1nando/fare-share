server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name taxi.demotest.live;

    ssl_certificate /etc/letsencrypt/live/taxi.demotest.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taxi.demotest.live/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/taxi-park/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /nft/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name taxi.demotest.live;
    return 301 https://taxi.demotest.live$request_uri;
}
