[package]
name = "taxi-park"
version = "0.1.0"
description = "Taxi Park reward and NFT lifecycle program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "taxi_park"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.1", features = ["associated_token", "token", "token_2022"] }
mpl-core = { version = "=0.12.1", default-features = false, features = ["anchor", "anchor-0-32"] }
